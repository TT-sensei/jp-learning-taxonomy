name: Validate learning data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check validator syntax
        run: node --check scripts/validate.mjs
      - name: Validate dataset
        run: node scripts/validate.mjs
      - name: Check candidate codes against official 82V12 CSV
        run: node scripts/check-official-curriculum-codes.mjs
      - name: Upload official code audit report
        if: ${{ always() && hashFiles('reports/official-code-audit.*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: official-code-audit-report
          path: reports/official-code-audit.*
          if-no-files-found: error
