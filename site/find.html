<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="小学校の学習内容を、ことば・教科・学年からすばやく探す。">
<title>学びを探す｜小学校 学びの地図</title>
<link rel="stylesheet" href="./find.css">
<script src="./find.js" defer></script>
</head>
<body>
<header class="masthead"><a href="./index.html" class="brand">小学校 <strong>学びの地図</strong></a><span>探したいことから、すぐに。</span></header>
<main>
<section class="intro">
<p class="eyebrow">LEARNING FINDER</p>
<h1>何を学びたい？</h1>
<p>ことばを入れても、教科や学年から選んでも探せます。</p>
</section>
<section class="search-panel" aria-label="学習内容を検索">
<label for="query">学習内容・キーワード</label>
<div class="search-row"><input id="query" type="search" placeholder="例：分数、台風、江戸時代、説明文" autocomplete="off"><button id="clear" type="button" class="quiet">クリア</button></div>
<div class="filters">
<div><label for="subject">教科</label><select id="subject"><option value="">すべての教科</option><option>国語</option><option>算数</option><option>理科</option><option>社会</option></select></div>
<div><label for="grade">学年</label><select id="grade"><option value="">すべての学年</option><option value="1">1年生</option><option value="2">2年生</option><option value="3">3年生</option><option value="4">4年生</option><option value="5">5年生</option><option value="6">6年生</option></select></div>
</div>
<div class="quick-search"><span>よく使う検索：</span><button data-query="分数">分数</button><button data-query="図形">図形</button><button data-query="電気">電気</button><button data-query="歴史">歴史</button><button data-query="文章">文章</button></div>
</section>
<section class="results-head"><h2>見つかった学習内容</h2><p id="count" role="status">読み込み中…</p></section>
<div id="results" class="results" aria-live="polite"></div>
<p id="empty" class="empty" hidden>見つかりませんでした。別のことばにしたり、教科・学年を広げたりしてみてください。</p>
<p class="note">学年表示は学習内容を探すための目安です。学校や教科書によって学習する時期が異なることがあります。</p>
</main>
<footer><a href="./index.html">学びの地図トップへ</a> · <a href="https://tt-sensei.github.io/learning-portal/">教材・学習サイトを探す</a></footer>
</body>
</html>
