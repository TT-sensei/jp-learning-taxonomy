<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="小学校の学習内容を、教科・分野・項目の順にたどって見つけられる学びの地図。">
<title>学びの地図｜教科から選ぶ</title>
<link rel="stylesheet" href="./find.css">
<script src="./find.js" defer></script>
</head>
<body>
<header class="masthead"><a href="./index.html" class="brand">小学校 <strong>学びの地図</strong></a><a class="portal-link" href="https://tt-sensei.github.io/learning-portal/">教材・学習サイト一覧へ ↗</a></header>
<main>
<section class="intro">
<p class="eyebrow">LEARNING MAP</p>
<h1 id="page-title">どの教科を見てみる？</h1>
<p id="page-description">気になる教科を選んで、学びの地図をたどってみよう。</p>
</section>
<nav class="breadcrumbs" id="breadcrumbs" aria-label="現在の場所"><span>教科を選ぶ</span></nav>
<section class="toolbar" aria-label="学びの探し方">
<div id="grade-filter" class="grade-filter" hidden><label for="grade">学年</label><select id="grade"><option value="">全学年</option><option value="1">1年</option><option value="2">2年</option><option value="3">3年</option><option value="4">4年</option><option value="5">5年</option><option value="6">6年</option></select></div>
<details class="search-details"><summary>言葉から探す</summary><div class="search-row"><input id="query" type="search" placeholder="例：分数、台風、江戸時代" autocomplete="off"><button id="clear-search" type="button">クリア</button></div><p class="search-hint">検索結果は、学習項目を直接開けます。</p></details>
</section>
<section id="view" aria-live="polite"><p class="loading">学習内容を読み込んでいます…</p></section>
<p id="status" class="status" role="status"></p>
<p class="note">学年表示は学習内容を探すための目安です。学校や教科書によって学習する時期が異なることがあります。</p>
</main>
<footer><a href="./index.html">学びの地図トップへ</a> · <a href="https://tt-sensei.github.io/learning-portal/">教材・学習サイトを探す</a></footer>
</body>
</html>
