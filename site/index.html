<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="小学校の学びが、学年を越えてどうつながるかをたどる学習マップ。">
  <title>学習マップ｜学びのつながりをたどる</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="top">
    <p class="eyebrow">JP LEARNING TAXONOMY</p>
    <h1>学びの道すじを見つけよう</h1>
    <p>前に学んだことは、次の学びにどうつながるのかな？</p>
  </header>
  <main>
    <section class="controls" aria-label="学習内容を選ぶ">
      <div class="controls-title"><span>どんなことを学ぶ？</span><p>教科や学年を選んでみよう</p></div>
      <label for="subject">教科</label>
      <select id="subject"><option value="">読み込み中</option></select>
      <label for="grade">学年</label>
      <select id="grade">
        <option value="">全学年</option>
        <option value="1">1年生</option><option value="2">2年生</option>
        <option value="3">3年生</option><option value="4">4年生</option>
        <option value="5">5年生</option><option value="6">6年生</option>
      </select>
      <label for="domain">学びのグループ</label>
      <select id="domain"><option value="">すべて</option></select>
      <label for="query">言葉でさがす</label>
      <input id="query" type="search" placeholder="例：分数、面積、地域">
      <p class="hint">気になる項目を選ぶと、前や次につながる学びが見られるよ。</p>
    </section>
    <section class="browse" aria-label="学習項目">
      <div class="browse-heading"><div><h2>どんな学びがあるかな？</h2><p>気になる項目を選んでみよう。</p></div><span id="count" class="count">読み込み中…</span></div>
      <div id="items" class="items"></div>
    </section>
    <aside id="detail" class="detail" aria-live="polite">
      <p class="muted">気になる学びを選んでみよう。前や次につながる学びが見られるよ。</p>
    </aside>
  </main>
  <footer><p>試作中 · 学びのつながりは、先生たちが見直しているところです。 <a href="./representations.html">算数の表現モデルマップ</a> · <a href="../README.md">このプロジェクトについて</a></p></footer>
</body>
</html>
