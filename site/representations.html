<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>算数の表し方マップ</title>
<link rel="stylesheet" href="./style.css">
<style>
main{display:block;max-width:1200px}.panel{background:#fff;border:1px solid #dce3e8;border-radius:14px;padding:16px}.panel label{display:block;font-weight:650;margin-bottom:6px}.model-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-top:1rem}.model-card{background:var(--panel,#fff);border:1px solid var(--line,#ddd);border-radius:14px;padding:1rem}.model-card h2{font-size:1.1rem;margin:.2rem 0 .6rem}.model-card p{line-height:1.65}.model-card ul{padding-left:1.2rem}.model-card li{margin:.35rem 0}.model-card a{color:inherit}.model-meta{font-size:.82rem;color:var(--muted,#666)}.model-purpose{font-size:.94rem;color:#425b68}.model-topic-title{display:block;line-height:1.5}.model-topic-description{font-size:.84rem;line-height:1.6;color:#5d707a;margin:.25rem 0 .75rem}.review-note{margin:12px 0 0;padding:10px 12px;border-radius:8px;background:#f3f6f7;color:#526974;font-size:.82rem;line-height:1.6}
</style>
</head>
<body>
<main>
<header class="top"><p class="eyebrow">JP LEARNING TAXONOMY</p><h1>算数の表し方マップ</h1><p>同じ問題も、実物・図・数直線・式・表・グラフなど、いろいろな方法で考えられるよ。どんなときに役立つか見てみよう。</p><p><a href="./index.html">← 学習項目マップへ戻る</a></p></header>
<section class="panel controls"><label for="grade-filter">学年の目安で絞り込む</label> <select id="grade-filter"><option value="0">全学年</option><option value="1">1年</option><option value="2">2年</option><option value="3">3年</option><option value="4">4年</option><option value="5">5年</option><option value="6">6年</option></select><p id="summary" class="muted">表し方を読み込んでいます。</p><p class="review-note">学年や学習項目とのつながりは確認中の目安です。ここに書かれた順番で学ぶ、という意味ではありません。</p><div id="models" class="model-grid" aria-live="polite"></div></section>
<footer class="muted"><p>それぞれの表し方と学習項目のつながりは、見直しながら作っています。出版社の図版を転載したものではありません。</p></footer>
</main>
<script src="representations.js" defer></script>
</body>
</html>
